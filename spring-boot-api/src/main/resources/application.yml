server:
  port: 8080

spring:
  application:
    name: ai-pr-reviewer-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_pr_reviewer}
    username: ${DB_USERNAME:harshil}
    password: ${DB_PASSWORD:harshil@123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

github:
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:your-github-webhook-secret}
  api:
    token: ${GITHUB_API_TOKEN:your-github-api-token}

azure:
  servicebus:
    connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:your-azure-servicebus-connection-string}
    queue-name: ${AZURE_SERVICEBUS_QUEUE_NAME:pr-review-requests}

logging:
  level:
    com.aipr: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
