server:
  port: 8080

spring:
  application:
    name: ai-pr-reviewer-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_pr_reviewer}
    username: ${DB_USERNAME:harshil}
    password: ${DB_PASSWORD:harshil@123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

github:
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:your-github-webhook-secret}
  api:
    token: ${GITHUB_API_TOKEN:your-github-api-token}

aws:
  sqs:
    queue-url: ${AWS_SQS_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/123456789012/pr-review-requests}
  region: ${AWS_REGION:us-east-1}

logging:
  level:
    com.aipr: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
