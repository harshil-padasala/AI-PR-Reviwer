api:
  image:
    repository: ai-pr-reviewer-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 512Mi
  ingress:
    enabled: false
    className: nginx
    host: pr-reviewer.example.com
    tls:
      enabled: false
      secretName: ""
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    awsRegion: us-east-1

worker:
  image:
    repository: ai-pr-reviewer-lambda
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 384Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  env:
    awsRegion: us-east-1
    openaiModel: "gpt-4o-mini"

# Secret-worthy values. Leave blank here and supply via a separate,
# gitignored values-secret.yaml (see values-secret.yaml.example) or
# --set at install time. Never commit real values into this file.
secrets:
  githubWebhookSecret: ""
  githubApiToken: ""
  dbPassword: ""
  awsSqsQueueUrl: ""
  openaiApiKey: ""

# Used when postgresql.enabled=false (the default / production-safe
# posture) — point at an external/managed Postgres instance.
database:
  external:
    host: ""
    port: 5432
    name: ai_pr_reviewer
    username: ""

# Optional in-cluster Postgres via the Bitnami subchart, for dev/test
# clusters only. Off by default — production deployments should use an
# external/managed Postgres via `database.external.*` above.
postgresql:
  enabled: false
  auth:
    username: aiprreviewer
    password: ""
    database: ai_pr_reviewer

serviceAccount:
  create: true
  name: ""
