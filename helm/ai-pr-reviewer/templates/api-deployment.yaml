apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-pr-reviewer.api.fullname" . }}
  labels:
    {{- include "ai-pr-reviewer.api.selectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-pr-reviewer.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-pr-reviewer.api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ai-pr-reviewer.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "ai-pr-reviewer.fullname" . }}-config
            - secretRef:
                name: {{ include "ai-pr-reviewer.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
