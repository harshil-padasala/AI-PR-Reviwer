apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-pr-reviewer.fullname" . }}-secrets
  labels:
    {{- include "ai-pr-reviewer.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  GITHUB_API_TOKEN: {{ .Values.secrets.githubApiToken | quote }}
  DB_PASSWORD: {{ include "ai-pr-reviewer.dbPassword" . | quote }}
  AZURE_SERVICEBUS_CONNECTION_STRING: {{ .Values.secrets.azureServicebusConnectionString | quote }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.secrets.azureOpenaiEndpoint | quote }}
  AZURE_OPENAI_DEPLOYMENT: {{ .Values.secrets.azureOpenaiDeployment | quote }}
  AZURE_OPENAI_API_KEY: {{ .Values.secrets.azureOpenaiApiKey | quote }}
