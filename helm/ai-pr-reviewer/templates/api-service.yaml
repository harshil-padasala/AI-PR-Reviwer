apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-pr-reviewer.api.fullname" . }}
  labels:
    {{- include "ai-pr-reviewer.api.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "ai-pr-reviewer.api.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      name: http
