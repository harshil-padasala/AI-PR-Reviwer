apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-pr-reviewer-worker
  labels:
    app: ai-pr-reviewer-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-pr-reviewer-worker
  template:
    metadata:
      labels:
        app: ai-pr-reviewer-worker
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: ai-pr-reviewer-worker:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: ai-pr-reviewer-config
            - secretRef:
                name: ai-pr-reviewer-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
