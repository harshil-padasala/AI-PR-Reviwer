# Assumes an nginx ingress controller. Adjust ingressClassName/annotations
# for your cluster's controller. This is the public entry point GitHub's
# webhook must reach — edit `host` before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-pr-reviewer-api
spec:
  ingressClassName: nginx
  rules:
    - host: pr-reviewer.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-pr-reviewer-api
                port:
                  number: 8080
